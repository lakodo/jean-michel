site_name: jean-michel
repo_url: https://github.com/lakodo/jean-michel
site_url: https://lakodo.github.io/jean-michel
site_description: An opinionated AI assistant for rigorous, constrained, asynchronous software development.
site_author: Joris GUERRY
edit_uri: edit/main/docs/
repo_name: lakodo/jean-michel
copyright: Maintained by <a href="https://lakodo.com">lakodo</a>.

nav:
  - Home: index.md
  - Installation: installation.md
  - MCP + VSCode Setup: mcp-vscode.md
  - Architecture Overview: architecture.md
  - Core Concepts: core-concepts.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["jean_michel"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lakodo/jean-michel
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/jean-michel

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
