<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jean-Michel Conversation</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f5f7;
        color: #16181d;
      }
      main {
        max-width: 900px;
        margin: 2rem auto;
        background: #fff;
        border: 1px solid #dfe3ea;
        border-radius: 10px;
        padding: 1rem 1.25rem;
      }
      h1 {
        margin: 0 0 0.25rem;
      }
      .meta {
        margin-bottom: 1rem;
        color: #4b5563;
        font-size: 0.95rem;
      }
      form {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      textarea {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        border: 1px solid #c9cfda;
        border-radius: 8px;
        padding: 0.75rem;
        font: inherit;
      }
      button {
        width: fit-content;
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 0.85rem;
        background: #0b63ce;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.8rem;
      }
      li {
        border: 1px solid #e1e5ee;
        border-radius: 8px;
        padding: 0.7rem;
        background: #fbfcfe;
      }
      .message-head {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.85rem;
        color: #4b5563;
      }
      .message-content {
        margin-top: 0.45rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Conversation</h1>
      <div class="meta">Default actor: {{ actor.name }} &lt;{{ actor.email }}&gt;</div>

      <form action="/messages" method="post">
        <label for="content">New message</label>
        <textarea id="content" name="content" required></textarea>
        <button type="submit">Send</button>
      </form>

      <ul>
        {% for message in messages %}
        <li>
          <div class="message-head">
            <span>#{{ message.id }} — {{ message.actor_name }} &lt;{{ message.actor_email }}&gt;</span>
            <span>{{ message.created_at }}</span>
          </div>
          <div class="message-content">{{ message.content }}</div>
        </li>
        {% else %}
        <li>No messages yet.</li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
